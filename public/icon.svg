<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Background rounded app squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner shadow highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" />

  <!-- Calculator Screen with glow -->
  <rect x="100" y="90" width="312" height="110" rx="24" fill="url(#screenGrad)" />
  <circle cx="370" cy="145" r="14" fill="#FFFFFF" opacity="0.9" />

  <!-- Calculator Buttons -->
  <!-- Row 1: + and - -->
  <rect x="100" y="240" width="140" height="105" rx="20" fill="#FFFFFF" />
  <text x="170" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="75" font-weight="900" fill="#1E40AF" text-anchor="middle">+</text>

  <rect x="272" y="240" width="140" height="105" rx="20" fill="#FFFFFF" />
  <text x="342" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="75" font-weight="900" fill="#1E40AF" text-anchor="middle">−</text>

  <!-- Row 2: × and = (gold) -->
  <rect x="100" y="365" width="140" height="105" rx="20" fill="#FFFFFF" />
  <text x="170" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="900" fill="#1E40AF" text-anchor="middle">×</text>

  <rect x="272" y="365" width="140" height="105" rx="20" fill="#FBBF24" />
  <text x="342" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="75" font-weight="900" fill="#78350F" text-anchor="middle">=</text>
</svg>
